name: CueScore Luxembourg
on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-lu
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_lu
      scripts: collect_cuescore.py collect_team.py
      files: lu_cuescore_raw.json.gz lu_team_raw.json
      country: Luxembourg
      cs_file: data/lu_cuescore_raw.json.gz
      team_file: data/lu_team_raw.json
    secrets: inherit
