# Predator Pro Billiard Series. Runs weekly (late corrections of events from the last 60 days), right after
# pbs_ids.json changes (new event ids, added by the monthly check), and by hand ("Re-read all" after a rule change).
name: PBS
on:
  schedule:
    - cron: '49 1 * * 1'   # Mondays 01:49 UTC
  push:
    branches: [main]
    paths: [pbs_ids.json, pbs_fixes.json]
  workflow_dispatch:
    inputs:
      all: {description: 'Re-read all events', type: boolean, default: false}
permissions:
  contents: write
concurrency:
  group: pbs
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: pbs
      scripts: pbs_update.py
      files: pbs_data.json.gz
      args: ${{ inputs.all && '--all' || '' }}
      minutes: 200
