# Predator Pro Billiard Series: runs daily inside sources.yml. This manual workflow is for a full re-read
# ("Re-read all events") after a rule change in pbs_update.py or pbs_fixes.json.
name: Collect PBS (full re-read, manual)
on:
  workflow_dispatch:
    inputs:
      all: {description: 'Re-read all events', type: boolean, default: false}
permissions:
  contents: write
jobs:
  pbs:
    uses: ./.github/workflows/collect.yml
    with:
      name: pbs
      scripts: pbs_update.py
      files: pbs_data.json.gz
      args: ${{ inputs.all && '--all' || '' }}
      minutes: 200
