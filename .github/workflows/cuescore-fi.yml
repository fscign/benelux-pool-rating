name: CueScore Finland
on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-fi
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_fi
      scripts: collect_cuescore.py collect_team.py
      files: fi_cuescore_raw.json.gz fi_team_raw.json
      country: Finland
      cs_file: data/fi_cuescore_raw.json.gz
      team_file: data/fi_team_raw.json
    secrets: inherit
