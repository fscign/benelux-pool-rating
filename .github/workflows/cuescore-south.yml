# CueScore Southern Europe: countries listed in cs_regions.py (region 'south'), all in one file. Added 13 Nov 2026.
# Only 8-ball, 9-ball, 10-ball and straight pool are gathered (same as every CueScore workflow since 13 Nov; handicap events included, flagged in the data).
name: CueScore Southern Europe
on:
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-south
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_south
      scripts: collect_cuescore.py collect_team.py
      files: south_cuescore_raw.json.gz south_team_raw.json
      region: south
      disciplines: '^(8|9|10)-Ball$|^Straightpool$'
      cs_file: data/south_cuescore_raw.json.gz
      team_file: data/south_team_raw.json
    secrets: inherit
