name: CueScore Netherlands
on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-nl
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_nl
      scripts: collect_cuescore.py collect_team.py
      files: nl_cuescore_raw.json.gz nl_team_raw.json
      country: Netherlands
      cs_file: data/nl_cuescore_raw.json.gz
      team_file: data/nl_team_raw.json
    secrets: inherit
