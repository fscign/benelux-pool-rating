name: CueScore Germany
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-de
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_de
      scripts: collect_cuescore.py collect_team.py
      files: de_cuescore_raw.json.gz de_team_raw.json
      country: Germany
      cs_file: data/de_cuescore_raw.json.gz
      team_file: data/de_team_raw.json
    secrets: inherit
