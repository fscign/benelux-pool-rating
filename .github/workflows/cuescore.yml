# CueScore, one job per country (tournaments + team events). A failing country does not stop the others.
name: Collect CueScore
on:
  schedule:
    - cron: '7 0 * * *'    # 00:07 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore
  cancel-in-progress: false
jobs:
  country:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {code: de, country: Germany}
          - {code: pl, country: Poland}
          - {code: cz, country: Czech Republic}
          - {code: nl, country: Netherlands}
          - {code: be, country: Belgium}
          - {code: lu, country: Luxembourg}
          - {code: at, country: Austria}
          - {code: ch, country: Switzerland}
          - {code: it, country: Italy}
          - {code: fr, country: France}
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_${{ matrix.code }}
      scripts: collect_cuescore.py collect_team.py
      files: ${{ matrix.code }}_cuescore_raw.json.gz ${{ matrix.code }}_team_raw.json
      country: ${{ matrix.country }}
      cs_file: data/${{ matrix.code }}_cuescore_raw.json.gz
      team_file: data/${{ matrix.code }}_team_raw.json
