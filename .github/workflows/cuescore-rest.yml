# CueScore Rest of World: countries listed in cs_regions.py (region 'rest'), all in one file. Added 13 Nov 2026.
# Only 8-ball, 9-ball, 10-ball and straight pool are gathered (same as every CueScore workflow since 13 Nov; handicap events included, flagged in the data).
name: CueScore Rest of World
on:
  schedule:
    - cron: '55 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-rest
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_rest
      scripts: collect_cuescore.py collect_team.py
      files: rest_cuescore_raw.json.gz rest_team_raw.json
      region: rest
      disciplines: '^(8|9|10)-Ball$|^Straightpool$'
      cs_file: data/rest_cuescore_raw.json.gz
      team_file: data/rest_team_raw.json
    secrets: inherit
