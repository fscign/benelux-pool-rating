# CueScore Balkans & East: countries listed in cs_regions.py (region 'east'), all in one file. Added 13 Nov 2026.
# Only 8-ball, 9-ball, 10-ball and straight pool are gathered (handicap events included, flagged in the data).
name: CueScore Balkans & East
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-east
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_east
      scripts: collect_cuescore.py collect_team.py
      files: east_cuescore_raw.json.gz east_team_raw.json
      region: east
      disciplines: '^(8|9|10)-Ball$|^Straightpool$'
      cs_file: data/east_cuescore_raw.json.gz
      team_file: data/east_team_raw.json
    secrets: inherit
