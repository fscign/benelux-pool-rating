name: CueScore Denmark
on:
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-dk
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_dk
      scripts: collect_cuescore.py collect_team.py
      files: dk_cuescore_raw.json.gz dk_team_raw.json
      country: Denmark
      cs_file: data/dk_cuescore_raw.json.gz
      team_file: data/dk_team_raw.json
    secrets: inherit
