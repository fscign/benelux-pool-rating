name: TournamentApp
on:
  schedule:
    - cron: '13 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tournamentapp
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: tournamentapp
      scripts: collect_tournamentapp.py
      files: ta_raw.json

    secrets: inherit
