name: CueScore Sweden
on:
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-se
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_se
      scripts: collect_cuescore.py collect_team.py
      files: se_cuescore_raw.json.gz se_team_raw.json
      country: Sweden
      cs_file: data/se_cuescore_raw.json.gz
      team_file: data/se_team_raw.json
    secrets: inherit
