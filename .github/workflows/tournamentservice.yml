name: Tournament Service
on:
  schedule:
    - cron: '1 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tournamentservice
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: tournamentservice
      scripts: collect_ts.py
      files: ts_raw.json.gz

    secrets: inherit
