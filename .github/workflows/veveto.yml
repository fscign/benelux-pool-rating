name: VeVeTo Hessen
on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veveto
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: veveto_hessen
      scripts: collect_veveto.py
      files: hessen_veveto.json.gz

    secrets: inherit
