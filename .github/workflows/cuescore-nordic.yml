# CueScore Nordic: Finland, Sweden, Denmark and Norway in one collector (one Run button).
# Each country runs as its own parallel job and keeps its own files, so one slow country does not hold up the others.
name: CueScore Nordic
on:
  schedule:
    - cron: '7 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-nordic
  cancel-in-progress: false
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: fi, country: Finland}
          - {cc: se, country: Sweden}
          - {cc: dk, country: Denmark}
          - {cc: no, country: Norway}
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_${{ matrix.cc }}
      scripts: collect_cuescore.py collect_team.py
      files: ${{ matrix.cc }}_cuescore_raw.json.gz ${{ matrix.cc }}_team_raw.json
      country: ${{ matrix.country }}
      cs_file: data/${{ matrix.cc }}_cuescore_raw.json.gz
      team_file: data/${{ matrix.cc }}_team_raw.json
    secrets: inherit
