# All other sources, one job each. A failing source does not stop the others.
name: Collect other sources
on:
  schedule:
    - cron: '7 1 * * *'    # 01:07 UTC daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sources
  cancel-in-progress: false
jobs:
  source:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {name: tournamentapp, script: collect_tournamentapp.py, files: ta_raw.json}
          - {name: nuliga_bavaria, script: collect_nuliga.py, files: bbv_nuliga_data.json.gz}
          - {name: veveto_hessen, script: collect_veveto.py, files: hessen_veveto.json.gz}
          - {name: scoretrek, script: collect_scoretrek.py, files: scoretrek_raw.json.gz}
          - {name: tournamentservice, script: collect_ts.py, files: ts_raw.json.gz}
          - {name: pzbil, script: collect_pzbil.py, files: pzbil_raw.json.gz}
          - {name: epbf, script: epbf_update.py, files: epbf_data.json.gz}
          - {name: wnt, script: wnt_update.py, files: wnt_data.json.gz}
    uses: ./.github/workflows/collect.yml
    with:
      name: ${{ matrix.name }}
      scripts: ${{ matrix.script }}
      files: ${{ matrix.files }}
    secrets: inherit
