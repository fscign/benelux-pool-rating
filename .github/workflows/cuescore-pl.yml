name: CueScore Poland
on:
  schedule:
    - cron: '19 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-pl
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_pl
      scripts: collect_cuescore.py collect_team.py
      files: pl_cuescore_raw.json.gz pl_team_raw.json
      country: Poland
      cs_file: data/pl_cuescore_raw.json.gz
      team_file: data/pl_team_raw.json
    secrets: inherit
