name: CueScore France
on:
  schedule:
    - cron: '55 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-fr
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_fr
      scripts: collect_cuescore.py collect_team.py
      files: fr_cuescore_raw.json.gz fr_team_raw.json
      country: France
      cs_file: data/fr_cuescore_raw.json.gz
      team_file: data/fr_team_raw.json
    secrets: inherit
