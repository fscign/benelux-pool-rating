name: CueScore Switzerland
on:
  schedule:
    - cron: '31 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-ch
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_ch
      scripts: collect_cuescore.py collect_team.py
      files: ch_cuescore_raw.json.gz ch_team_raw.json
      country: Switzerland
      cs_file: data/ch_cuescore_raw.json.gz
      team_file: data/ch_team_raw.json
    secrets: inherit
