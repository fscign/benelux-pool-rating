# CueScore Netherlands, Belgium and Luxembourg (started 7 Nov 2026). Each country is a separate step: if one fails,
# the others are still saved. The first run reads everything since 2016; if it hits the time limit, what was read is saved
# and the next run continues where it stopped.
name: Data collection (Netherlands, Belgium, Luxembourg)
on:
  schedule:
    - cron: '7 0 * * *'    # every day 00:07 UTC, before the German rating update (02:47 UTC) copies these files
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Collect each country (tournaments + team events)
        shell: bash
        run: |
          mkdir -p data/status
          for c in "Luxembourg lu" "Belgium be" "Netherlands nl"; do
            set -- $c; name=$1; code=$2
            for job in collect_cuescore.py collect_team.py; do
              export CS_COUNTRY="$name" CS_FILE="data/${code}_cuescore_raw.json.gz" CS_TEAM_FILE="data/${code}_team_raw.json"
              if timeout 100m python3 -I $job > log.txt 2>&1; then res=OK; else res=FAILED; fi
              { echo "### $name $job ($res)"; echo '```'; tail -15 log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              echo "$(date -u +'%Y-%m-%d %H:%M') UTC | $res | $(grep -v '^\s*$' log.txt | tail -1 | cut -c1-200)" > "data/status/${code}_${job}.txt"
            done
          done
      - name: Save the collected data
        if: always()
        run: |
          git config user.name "rating-bot"
          git config user.email "rating-bot@users.noreply.github.com"
          git add data || true
          git commit -m "Collection $(date +%Y-%m-%d)" || { echo "No changes"; exit 0; }
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
