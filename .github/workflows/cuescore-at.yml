name: CueScore Austria
on:
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-at
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_at
      scripts: collect_cuescore.py collect_team.py
      files: at_cuescore_raw.json.gz at_team_raw.json
      country: Austria
      cs_file: data/at_cuescore_raw.json.gz
      team_file: data/at_team_raw.json
    secrets: inherit
