name: CueScore Czech Republic
on:
  schedule:
    - cron: '31 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-cz
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_cz
      scripts: collect_cuescore.py collect_team.py
      files: cz_cuescore_raw.json.gz cz_team_raw.json
      country: Czech Republic
      cs_file: data/cz_cuescore_raw.json.gz
      team_file: data/cz_team_raw.json
    secrets: inherit
