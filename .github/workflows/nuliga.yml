name: nuLiga Bavaria
on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nuliga
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: nuliga_bavaria
      scripts: collect_nuliga.py
      files: bbv_nuliga_data.json.gz

    secrets: inherit
