name: CueScore Belgium
on:
  schedule:
    - cron: '55 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-be
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_be
      scripts: collect_cuescore.py collect_team.py
      files: be_cuescore_raw.json.gz be_team_raw.json
      country: Belgium
      cs_file: data/be_cuescore_raw.json.gz
      team_file: data/be_team_raw.json
    secrets: inherit
