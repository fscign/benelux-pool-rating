name: CueScore Italy
on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-it
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_it
      scripts: collect_cuescore.py collect_team.py
      files: it_cuescore_raw.json.gz it_team_raw.json
      country: Italy
      cs_file: data/it_cuescore_raw.json.gz
      team_file: data/it_team_raw.json
    secrets: inherit
