name: CueScore Norway
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuescore-no
  cancel-in-progress: false
jobs:
  collect:
    uses: ./.github/workflows/collect.yml
    with:
      name: cuescore_no
      scripts: collect_cuescore.py collect_team.py
      files: no_cuescore_raw.json.gz no_team_raw.json
      country: Norway
      cs_file: data/no_cuescore_raw.json.gz
      team_file: data/no_team_raw.json
    secrets: inherit
